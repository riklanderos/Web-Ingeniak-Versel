<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Vista móvil</title>
<style>html,body{margin:0;background:#111}iframe{display:block;border:0;width:390px;height:844px}</style></head>
<body><iframe id="f"></iframe><script>
const p=new URLSearchParams(location.search);const f=document.getElementById('f');
if(p.get('w'))f.style.width=p.get('w')+'px';if(p.get('h'))f.style.height=p.get('h')+'px';
f.src=p.get('u')||'/';</script></body></html>
